name: Network independence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: network-independence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Prepare locked build dependencies before network isolation
        run: npm ci
      - name: Check approved runtime resources and exact local font files
        run: npm run check:network
      - name: Build, package and exercise production server and browser inside loopback-only network namespace
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium)"
          test -n "$chrome"
          sudo env "PATH=$PATH" "CHROME_PATH=$chrome" "REPAID_NETWORK_WORKSPACE=$RUNNER_TEMP" bash scripts/network-isolation-linux.sh
      - name: Publish sanitized result files without opening private fixture directories
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/network-evidence"
          sudo env "REPAID_NETWORK_WORKSPACE=$RUNNER_TEMP" node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),root=fs.realpathSync(process.env.REPAID_NETWORK_WORKSPACE);
          for(const name of fs.readdirSync(root)){
            if(!/^repaid-network-[A-Za-z0-9]+$/.test(name))continue;
            const dir=path.join(root,name),result=path.join(dir,'results.json');
            if(fs.lstatSync(dir).isSymbolicLink()||!fs.existsSync(result)||!fs.lstatSync(result).isFile())continue;
            const data=JSON.parse(fs.readFileSync(result,'utf8'));
            if(data.originalDataUsed!==false||data.productionVerified!==false||!Array.isArray(data.checks))throw Error('Unexpected result format');
            const target=path.join(root,'network-evidence',name+'.json');
            fs.writeFileSync(target,JSON.stringify(data,null,2)+'\n',{mode:0o644});
          }
          NODE
      - name: Retain sanitized network and performance evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-independence-evidence
          path: ${{ runner.temp }}/network-evidence/*.json
          if-no-files-found: warn
