name: Extended Linux wizard acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wizard-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  wizard-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise real installer, private Git, reset/recovery and ACME lifecycle on disposable host
        run: sudo env GITHUB_SHA="$GITHUB_SHA" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" REPAID_WIZARD_ACCEPTANCE=1 bash scripts/wizard-linux-acceptance.sh
      - name: Bounded diagnostics (no credentials or private databases)
        if: failure()
        run: |
          sudo journalctl -u repaid -u nginx -u repaid-backup -n 50 --no-pager || true
          sudo tail -n 50 /var/log/repaid/deploy.log || true
