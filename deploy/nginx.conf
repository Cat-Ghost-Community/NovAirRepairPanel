# نمونهٔ reverse proxy برای «تعمیرکار» — آن را در /etc/nginx/sites-available/repaid قرار دهید
# و سپس: sudo ln -s /etc/nginx/sites-available/repaid /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# اگر سرویس با داکر روی 3000 منتشر شده، upstream را همان 127.0.0.1:3000 نگه دارید.
# TLS را با certbot بگیرید: sudo certbot --nginx -d repaid.example.com

upstream repaid_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name repaid.example.com;
    # پس از دریافت گواهی، این بلاک را به HTTPS هدایت کنید (certbot خودش انجام می‌دهد)

    # پیوست‌ها و بکاپ دیتابیس می‌توانند بزرگ شوند
    client_max_body_size 25m;

    # فشرده‌سازی خروجی متنی
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # فایل‌های ایستای Next.js (محتوا-هش دارند ⇒ کش طولانی)
    location /_next/static/ {
        proxy_pass http://repaid_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # سلامت سرویس برای پایش (بدون احراز هویت)
    location = /api/health {
        proxy_pass http://repaid_app;
        access_log off;
    }

    location / {
        proxy_pass http://repaid_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
